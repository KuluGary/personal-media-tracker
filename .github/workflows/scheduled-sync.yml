name: Scheduled Media Sync

on:
  schedule:
    - cron: "0 0 */15 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      STEAM_ID: ${{ secrets.STEAM_ID }}
      RETROACHIEVEMENTS_API_KEY: ${{ secrets.RETROACHIEVEMENTS_API_KEY }}
      RETROACHIEVEMENTS_USER_ID: ${{ secrets.RETROACHIEVEMENTS_USER_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
      FRESHRSS_USER_NAME: ${{ secrets.FRESHRSS_USER_NAME }}
      FRESHRSS_API_PASSWORD: ${{ secrets.FRESHRSS_API_PASSWORD }}
      FRESHRSS_FILTER_TAG: ${{ secrets.FRESHRSS_FILTER_TAG }}
      PAGEBOUND_USER_ID: ${{ secrets.PAGEBOUND_USER_ID }}
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_BLOG_IDENTIFIER: ${{ secrets.TUMBLR_BLOG_IDENTIFIER }}
      HOWLONGTOBEAT_USER_ID: ${{ secrets.HOWLONGTOBEAT_USER_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Initialize Tracker
        run: |
          npm start -- init \
            --url "$SUPABASE_URL" \
            --service-key "$SUPABASE_SERVICE_KEY"

      - name: Configure Steam
        run: |
          npm start -- add steam \
            --api-key "$STEAM_API_KEY" \
            --steam-id "$STEAM_ID"

      - name: Configure RetroAchievements
        run: |
          npm start -- add retroachievements \
            --api-key "$RETROACHIEVEMENTS_API_KEY" \
            --user-id "$RETROACHIEVEMENTS_USER_ID"

      - name: Configure YouTube
        run: |
          npm start -- add youtube \
            --api-key "$YOUTUBE_API_KEY"

      - name: Configure Tumblr
        run: |
          npm start -- add tumblr \
            --consumer-key "$TUMBLR_CONSUMER_KEY" \
            --blog-identifier "$TUMBLR_BLOG_IDENTIFIER"

      - name: Configure FreshRSS
        run: |
          npm start -- add freshrss \
            --api-password "$FRESHRSS_API_PASSWORD" \
            --user-name "$FRESHRSS_USER_NAME"

      - name: Configure Pagebound
        run: |
          npm start -- add pagebound \
            --user-id "$PAGEBOUND_USER_ID"

      - name: Configure How Long To Beat
        run: |
          npm start -- add howlongtobeat \
            --user-id "$HOWLONGTOBEAT_USER_ID"

      - name: Run Steam sync
        run: npm start -- sync steam games

      - name: Run RetroAchievements sync
        run: npm start -- sync retroachievements games

      - name: Run How Long To Beat sync
        run: npm start -- sync howlongtobeat

      - name: Run YouTube sync
        run: npm start -- sync youtube playlist-items --playlist "$YOUTUBE_PLAYLIST_ID"

      - name: Run FreshRSS sync
        run: npm start -- sync freshrss --tag "$FRESHRSS_FILTER_TAG"

      - name: Run Pagebound sync
        run: npm start -- sync pagebound

      - name: Run Tumblr sync
        run: npm start -- sync tumblr
